name: barat-pay

services:
  postgres:
    image: postgres:17-alpine
    container_name: barat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: barat
      POSTGRES_PASSWORD: barat
      POSTGRES_DB: barat
      # Deterministic collation so ORDER BY behaves identically on every machine.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - barat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barat -d barat']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command:
      - postgres
      - '-c'
      - 'timezone=UTC'
      - '-c'
      - 'max_connections=200'

  redis:
    image: redis:8-alpine
    container_name: barat-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - barat-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    command:
      - redis-server
      - '--appendonly'
      - 'yes'
      - '--appendfsync'
      - 'everysec'

volumes:
  barat-postgres-data:
    name: barat-postgres-data
  barat-redis-data:
    name: barat-redis-data
