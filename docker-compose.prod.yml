name: barat-pay-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-barat}
      TZ: UTC
      PGTZ: UTC
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - barat-postgres-data:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 384m
    memswap_limit: 768m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command: [postgres, -c, timezone=UTC, -c, max_connections=80]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    env_file: .env.production
    command:
      [
        redis-server,
        --appendonly,
        yes,
        --appendfsync,
        everysec,
        --maxmemory,
        96mb,
        --maxmemory-policy,
        noeviction,
      ]
    volumes:
      - barat-redis-data:/data
    networks: [internal]
    mem_limit: 128m
    memswap_limit: 256m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    image: ${BARAT_API_IMAGE:-baratpay/api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-barat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-barat}?schema=public
      REDIS_URL: redis://redis:6379
    networks: [internal]
    mem_limit: 320m
    memswap_limit: 640m
    expose: ['4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    image: ${BARAT_WORKER_IMAGE:-baratpay/worker:latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-barat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-barat}?schema=public
      REDIS_URL: redis://redis:6379
    networks: [internal]
    mem_limit: 256m
    memswap_limit: 512m
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://api:4000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: ${BARAT_WEB_IMAGE:-baratpay/web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks: [internal]
    mem_limit: 256m
    memswap_limit: 512m
    expose: ['3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  admin:
    image: ${BARAT_ADMIN_IMAGE:-baratpay/admin:latest}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    networks: [internal]
    mem_limit: 192m
    memswap_limit: 384m
    expose: ['3001']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
      admin: { condition: service_healthy }
      api: { condition: service_healthy }
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks: [internal]
    mem_limit: 64m
    memswap_limit: 128m
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  barat-postgres-data:
    name: barat-postgres-data
  barat-redis-data:
    name: barat-redis-data
  certbot-etc:
    name: barat-certbot-etc
  certbot-www:
    name: barat-certbot-www

networks:
  internal:
    name: barat-internal
    driver: bridge
    internal: true
