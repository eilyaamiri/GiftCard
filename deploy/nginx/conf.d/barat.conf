server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  # Enable this location while obtaining/renewing Let's Encrypt certificates.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  # Uncomment after certificates exist and DNS points at this host.
  # listen 443 ssl http2;
  # listen [::]:443 ssl http2;
  # ssl_certificate /etc/letsencrypt/live/pay.example.ir/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/pay.example.ir/privkey.pem;
  # ssl_protocols TLSv1.2 TLSv1.3;
  # return 301 https://$host$request_uri;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /nginx-health { access_log off; return 200 "ok\n"; }

  location /api/ {
    proxy_pass http://barat_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }

  location /admin/ {
    proxy_pass http://barat_admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://barat_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
  }
}

