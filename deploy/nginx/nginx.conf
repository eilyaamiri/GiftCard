worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json application/javascript application/xml image/svg+xml text/css text/plain;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream barat_web { server web:3000; keepalive 16; }
  upstream barat_admin { server admin:3001; keepalive 8; }
  upstream barat_api { server api:4000; keepalive 16; }

  include /etc/nginx/conf.d/*.conf;
}
