# Shared proxy settings for the Node upstreams.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";
proxy_read_timeout 120s;

# Access-log format for the payment routes: the path WITHOUT its query string.
# The gateways come back with their session identifier in the query — BazaarPay
# as `?token=...`, ZarinPal as `?Authority=...` — and the default `combined`
# format writes the full request line, so every payment token landed in
# /var/log/nginx/access.log in clear (AGENTS.md rule 10). The Referer is dropped
# too: on the return leg it is the gateway's own page, which can carry the same
# token in its URL. Everything else on the line is the same as `combined`.
log_format baratpay_noquery '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"-" "$http_user_agent"';

# Plain HTTP. Kept only to answer the ACME challenge and to send everyone to
# HTTPS. It must stay reachable: the certificate is renewed over port 80, with
# certbot's webroot authenticator pointed at /var/www/html.
#
# HTTPS is not decoration here. On this network a transparent middlebox rewrites
# any cleartext request whose path contains /chunks/ into a 302 towards a private
# address, which is exactly where the JS and CSS bundles live. Over cleartext the
# panel therefore loads as unstyled HTML no matter what the server sends. A TLS
# connection cannot be inspected that way, so encrypting the transport is what
# actually fixes the rendering.
#
# `listen ... ssl http2` rather than the `http2 on;` directive: Ubuntu 24.04
# ships nginx 1.24, which does not know that directive (added in 1.25.1). The
# parameter form is accepted by every version.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# The bare domain only forwards to www, so there is one canonical storefront
# origin for cookies, canonicals and the sitemap.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name centohub.com;

    ssl_certificate     /etc/letsencrypt/live/centohub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centohub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.centohub.com$request_uri;
}

# Customer storefront. The API is mounted on the SAME origin under /api so the
# session cookie stays same-origin and no CORS pre-flight is ever needed.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name www.centohub.com;
    client_max_body_size 2m;
    # Per server rather than at http level: Ubuntu's nginx.conf carries its own
    # (commented-out) `server_tokens` in the http block, and once someone enables
    # it a second one at that level fails `nginx -t` as a duplicate.
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/centohub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centohub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Worker-to-API surface. The worker calls the API on 127.0.0.1:4000
    # (INTERNAL_API_URL) and never through this host, so nothing legitimate
    # arrives here. Its only defence would otherwise be one shared token.
    location ^~ /api/internal/ {
        return 404;
    }

    # Gateway return legs carry the payment token in the query string.
    location ^~ /api/payments/ {
        access_log /var/log/nginx/access.log baratpay_noquery;
        proxy_pass http://127.0.0.1:4000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# Admin panel and operator workspace, on their own origin. A separate hostname
# rather than a separate port, so the staff cookie is scoped to a host the
# storefront cannot read: cookies ignore the port, so a port shared everything
# with the storefront.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myspace.centohub.com;
    client_max_body_size 2m;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/centohub.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/centohub.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /api/internal/ {
        return 404;
    }

    location ^~ /api/payments/ {
        access_log /var/log/nginx/access.log baratpay_noquery;
        proxy_pass http://127.0.0.1:4000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
